<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>컴퓨터공학 자습 로드맵 — 다음에 뭘 공부할까?</title>
<meta name="description" content="컴퓨터공학과 학생을 위한 인터랙티브 자습 로드맵. 전공 10개 분야 50개 주제를 마인드맵으로, 무엇을 할 수 있으면 끝인지까지." />
<meta property="og:title" content="컴퓨터공학 자습 로드맵" />
<meta property="og:description" content="전공 10개 분야 50개 주제를 분야별 마인드맵으로 찾아보세요." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#0b0f1a" />
<meta property="og:image" content="icons/icon-512.png" />
<link rel="manifest" href="manifest.webmanifest?v=1" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CS 로드맵" />
<link rel="stylesheet" href="css/style.css?v=1" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <strong>컴퓨터공학 자습 로드맵</strong>
      <span>전공 10개 분야 · 다음에 뭘 공부할까?</span>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="주제 검색 (예: 포인터, 인덱스)" autocomplete="off" aria-label="주제 검색" />
      <kbd>/</kbd>
    </div>
    <div class="level-filter" role="group" aria-label="난이도 필터">
      <button class="lv-chip on" data-level="1"><i style="--c:#4ade80"></i>1학년</button>
      <button class="lv-chip on" data-level="2"><i style="--c:#facc15"></i>2~3학년</button>
      <button class="lv-chip on" data-level="3"><i style="--c:#f87171"></i>심화</button>
    </div>
    <button id="expandAll" class="ghost-btn" title="전체 펼치기 / 접기">전체 접기</button>
  </div>
</header>

<main class="stage">
  <svg id="map" role="img" aria-label="컴퓨터공학 자습 로드맵 마인드맵">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g id="viewport">
      <g id="edges"></g>
      <g id="nodes"></g>
    </g>
  </svg>

  <button id="installBtn" class="install-btn" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <span>앱으로 설치</span>
  </button>

  <div class="zoom-controls">
    <button data-zoom="in" title="확대">+</button>
    <button data-zoom="out" title="축소">−</button>
    <button data-zoom="fit" title="화면에 맞추기">⤢</button>
  </div>

  <p class="hint" id="hint">주제를 클릭하면 무엇을 할 수 있어야 끝인지, 어디서 막히는지가 나온다 · 같은 분야의 다른 주제도 함께 펼쳐진다</p>
</main>

<aside class="panel" id="panel" aria-hidden="true">
  <button class="panel-close" id="panelClose" aria-label="닫기">✕</button>
  <div class="panel-body" id="panelBody"></div>
</aside>
<div class="panel-scrim" id="scrim"></div>

<div class="install-help" id="installHelp" hidden>
  <div class="install-card" role="dialog" aria-modal="true" aria-label="홈 화면에 추가하는 방법">
    <button class="install-close" data-close aria-label="닫기">✕</button>
    <h3>홈 화면에 추가하기</h3>
    <p>이 브라우저는 자동 설치를 지원하지 않는다. 아래 순서로 직접 추가하면 앱처럼 실행된다.</p>
    <ol>
      <li>주소창 옆(또는 하단)의 <b>공유</b> 버튼을 누른다</li>
      <li>메뉴를 내려 <b>홈 화면에 추가</b>를 고른다</li>
      <li><b>추가</b>를 누르면 홈 화면에 아이콘이 생긴다</li>
    </ol>
    <button class="install-ok" data-close>알겠어요</button>
  </div>
</div>

<!-- 코어 → 분야(로드 순서 = 마인드맵 배치 순서) → 렌더러 -->
<script src="js/data.js?v=1"></script>
<script src="js/domains/01-programming.js?v=1"></script>
<script src="js/domains/02-datastructure.js?v=1"></script>
<script src="js/domains/03-algorithm.js?v=1"></script>
<script src="js/domains/04-architecture.js?v=1"></script>
<script src="js/domains/05-os.js?v=1"></script>
<script src="js/domains/06-network.js?v=1"></script>
<script src="js/domains/07-database.js?v=1"></script>
<script src="js/domains/08-engineering.js?v=1"></script>
<script src="js/domains/09-theory.js?v=1"></script>
<script src="js/domains/10-advanced.js?v=1"></script>
<script src="js/mindmap.js?v=1"></script>
<script src="js/app.js?v=1"></script>
<script src="js/pwa.js?v=1"></script>
</body>
</html>
